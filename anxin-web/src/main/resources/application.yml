server:
  port: 8080

spring:
  application:
    name: anxin-web
  profiles:
    active: dev  # 默认激活 dev；生产启动时用 --spring.profiles.active=prod 覆盖

  datasource:
    url: jdbc:mysql://${anxin.mysql.ip}:${anxin.mysql.port}/${anxin.mysql.db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${anxin.mysql.username}
    password: ${anxin.mysql.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      database: 0
      host: ${anxin.redis.host}
      port: ${anxin.redis.port}
      password: ${anxin.redis.password}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# RocketMQ 配置
rocketmq:
  name-server: ${anxin.mq.name-server}
  producer:
    group: ${anxin.mq.producer-group}

# MyBatis 配置
mybatis:
  mapper-locations: classpath*:com/anxin/mapper/**/*.xml
  type-aliases-package: com.anxin.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false


# 微信小程序配置 - 【预留】后期拿到 appid/secret 后填写真实值
wechat:
  appid: ""                 # 小程序 AppID（后期填）
  secret: ""                # 小程序 AppSecret（后期填）
  grant-type: authorization_code
  jscode2session-url: https://api.weixin.qq.com/sns/jscode2session


# JWT 配置（本地开发占位；生产用 application-prod.yml 的环境变量 JWT_SECRET）
anxin:
  jwt:
    secret: anxin-dev-secret-key-for-local-dev-only-2026
    expiration: 3600000     # 1小时（毫秒）

