server:
  port: 8080

spring:
  application:
    name: anxin-web
  profiles:
    active: dev  # 默认激活 dev；生产启动时用 --spring.profiles.active=prod 覆盖
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
  datasource:
    url: jdbc:mysql://${anxin.mysql.ip}:${anxin.mysql.port}/${anxin.mysql.db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${anxin.mysql.username}
    password: ${anxin.mysql.password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      database: 0
      host: ${anxin.redis.host}
      port: ${anxin.redis.port}
      password: ${anxin.redis.password}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

  # Spring AI 配置
  ai:
    openai:
      api-key: ${anxin.ai.openai.api-key}
      base-url: ${anxin.ai.openai.base-url}
      chat:
        options:
          model: ${anxin.ai.openai.model}
          temperature: 0.3

# RocketMQ 配置
rocketmq:
  name-server: ${anxin.mq.name-server}
  producer:
    group: ${anxin.mq.producer-group}

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:com/anxin/mapper/**/*.xml
  type-aliases-package: com.anxin.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    aggressive-lazy-loading: false


# JWT 配置（本地开发占位；生产用 application-prod.yml 的环境变量注入）
anxin:
  jwt:
    access-secret: anxin-dev-access-secret-key-for-local-dev-only-2026
    refresh-secret: anxin-dev-refresh-secret-key-for-local-dev-only-2026
    access-expiration: 7200000     # 2小时（毫秒）
    refresh-expiration: 604800000  # 7天（毫秒）
  # 阿里云 OSS 配置（AK/SK 通过环境变量注入，禁止写死提交 git）
  oss:
    endpoint: ${OSS_ENDPOINT:}  # 不带协议
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:}
    public-domain: ${OSS_PUBLIC_DOMAIN:}  # 可选自定义域名；为空则自动拼 https://{bucket}.{endpoint}/
  # 微信小程序配置（appid/secret 通过环境变量注入）
  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
    grant-type: authorization_code
    # 获取 access_token 时使用的固定授权类型（与登录换取 openid 的 grant-type 不同）
    token-grant-type: client_credential
    # 获取 session_key 和 openid
    jscode2session-url: https://api.weixin.qq.com/sns/jscode2session
    # 获取 access_token
    token-url: https://api.weixin.qq.com/cgi-bin/token
    # 图片安全检测
    img-sec-check-url: https://api.weixin.qq.com/wxa/img_sec_check

