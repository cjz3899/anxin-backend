# ================= 生产环境 =================
# 敏感值（host/账号/密码/密钥）全部通过环境变量注入，不设默认值：缺失时启动直接失败，防止明文落库
# 部署时注入：export / Docker env / K8s Secret，然后 java -jar anxin-web.jar --spring.profiles.active=prod

anxin:
  mysql:
    ip: ${MYSQL_HOST}
    port: 3306
    db: ${MYSQL_DB}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  redis:
    host: ${REDIS_HOST}
    port: 6379
    password: ${REDIS_PASSWORD}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-expiration: ${JWT_ACCESS_EXPIRATION:7200000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  ai:
    openai:
      api-key: ${AI_API_KEY}
      base-url: ${AI_BASE_URL}
      model: ${AI_MODEL}
  # 覆盖基础配置里的空默认值：生产缺这些变量直接启动失败，避免上线后才发现上传/登录不可用
  oss:
    endpoint: ${OSS_ENDPOINT}
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    bucket: ${OSS_BUCKET}
  wechat:
    appid: ${WECHAT_APPID}
    secret: ${WECHAT_SECRET}
  task:
    worker-size: ${TASK_WORKER_SIZE:2}
    queue-size: ${TASK_QUEUE_SIZE:64}
    chat-worker-size: ${CHAT_WORKER_SIZE:4}
    chat-queue-size: ${CHAT_QUEUE_SIZE:64}

server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

# SQL 日志走 slf4j，由日志级别控制，不直打 stdout
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    root: info
    com.anxin: info
